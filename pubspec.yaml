name: mihomote
description: "A Material 3 Expressive remote control panel for Mihomo."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI: official decoupled Material library + Material 3 Expressive components.
  # Never import package:flutter/material.dart (see AGENTS.md §3.1).
  material_ui: ^1.8.0
  material_3_expressive: ^1.2.0
  material_new_shapes: ^1.0.0
  motor: ^1.1.0
  dynamic_color: ^2.1.0

  # State, routing, networking, storage.
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
