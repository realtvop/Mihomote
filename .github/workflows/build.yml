name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Create installer and portable archive
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches.Groups[1].Value
          if (-not $version) { throw 'Version missing from pubspec.yaml' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/mihomote-windows-portable.zip
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release
      - name: Archive macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/mihomote.app mihomote-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: mihomote-macos.zip
          if-no-files-found: error
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry mihomote-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: mihomote-ios-unsigned.ipa
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - name: Create AppImage
        run: |
          mkdir -p AppDir
          cp -a build/linux/x64/release/bundle/. AppDir/
          cp linux/packaging/mihomote.desktop AppDir/
          cp web/icons/Icon-512.png AppDir/mihomote.png
          ln -s mihomote AppDir/AppRun
          curl -fL --retry 3 -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir mihomote-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-x86_64
          path: mihomote-linux-x86_64.AppImage
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --wasm --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: build/web/
          if-no-files-found: error
